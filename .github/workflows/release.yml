name: Publicar Zenty para Windows
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      ZENTY_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Comprobar versión del tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "El tag debe coincidir con package.json" }
      - run: npm test
      - run: npm run lint
      - name: Compilar y publicar instalador y metadatos de actualización
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar la release cuando todos los archivos están listos
        shell: pwsh
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Zenty-Windows
          path: |
            releases/Zenty-Installer/*.exe
            releases/Zenty-Installer/*.blockmap
            releases/Zenty-Installer/latest.yml
